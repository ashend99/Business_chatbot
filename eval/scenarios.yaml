# Eval scenarios for the bot agent (services/bot_engine.py). Each scenario
# drives a simulated customer (eval/conversation_agent.py) through a
# multi-turn chat against the real /bot/message endpoint; eval/eval_agent.py
# grades the resulting transcript + DB state against `success_criteria`
# later, separately, so a conversation only needs to be generated once.
#
# `persona` is the simulated customer's own system prompt -- write it as
# instructions to that customer, not a description of them in third person.
# `success_criteria` is graded by an LLM judge against the transcript, so
# write it as concrete, checkable behaviors, not vague vibes.
#
# IMPORTANT: this platform is multi-tenant and deliberately multi-vertical
# (restaurants, cake makers, online sellers, ...) -- personas describe
# customer *behavior*, never a specific tenant's actual catalog items,
# business type, or business name. The simulated customer is itself an LLM
# reacting to whatever the real bot actually says, so a persona like "ask
# what's available, then pick whatever the assistant mentions first" works
# against any tenant's real catalog/documents without knowing its contents
# in advance -- unlike naming a specific dish, which only makes sense
# against one tenant's menu.

scenarios:
  - id: order_specific_item
    channel: website_widget
    persona: >
      You are a customer of this business's chat assistant. Ask what's
      available to buy. Once the assistant mentions a specific item, say
      you'd like to order one of it (pick a specific size/variant if it
      offers a choice), and ask for it to be delivered to "12 Main St"
      around 7pm tonight. When asked for your name and phone number, give
      "Kasun" and "0771234567". Once the bot summarizes your order
      correctly, confirm it. After it says the order is confirmed, thank
      them and end the conversation.
    max_turns: 8
    success_criteria: >
      The bot looks up the real catalog price for the item it offered (do
      not accept an invented price). It asks for delivery details and
      contact info before confirming. It never tells the customer the order
      is confirmed until confirm_order has actually succeeded (check the
      order/lead DB snapshot: an order should exist with status=placed,
      correct item/quantity, and a linked lead with name+phone). It never
      mentions collecting payment.

  - id: vague_menu_question
    channel: website_widget
    persona: >
      You are a customer who is not sure what to get. Open with something
      vague like "what do you have available today?" without naming
      anything specific. If the bot offers you a list of options, thank
      them and end the conversation without ordering anything.
    max_turns: 4
    success_criteria: >
      The bot must NOT claim nothing is available. It should list real
      items that actually exist in the catalog (grouped or not), not a
      generic apology. No order or lead should be created (the customer
      never expressed intent to buy).

  - id: category_narrowing
    channel: website_widget
    persona: >
      You are a customer who first asks generally what's available, without
      naming anything specific. Once the assistant's answer reveals some
      broad grouping or category of items that actually exist, ask a
      follow-up naming that category in general terms (e.g. "what drinks do
      you have?" or "what kinds of X do you offer?", using whatever category
      the assistant's own answer actually suggested exists -- never guess a
      category it didn't hint at). After the bot answers that, ask a brief
      follow-up about one of the listed items' price, then end the
      conversation without ordering.
    max_turns: 6
    success_criteria: >
      The bot lists real items belonging to that category, not an empty/
      no-results answer -- since the category was one the assistant itself
      already indicated exists, an empty/unavailable response here would be
      a genuine failure, not a case where the category legitimately doesn't
      exist. The follow-up price it gives must match a real catalog price.

  - id: payment_boundary
    channel: website_widget
    persona: >
      You are a customer ordering one of something specific the assistant
      offers, for pickup today at 6pm. Follow these steps in order, and do
      not end the conversation until step 5 is actually done: (1) ask for
      the item and pickup details; (2) once the assistant is ready to
      finalize, ask "can I pay you right now with my card?" and see how it
      responds; (3) say "ok, please confirm it"; (4) if the assistant asks
      for your name and/or phone number at any point -- including now --
      give "Nadeesha" and "0779998887" right away, do not skip or delay
      this; (5) only once the assistant actually says the order is
      confirmed, thank them and end the conversation. If the assistant asks
      for anything else you haven't given yet, keep responding and
      providing it rather than ending early.
    max_turns: 10
    success_criteria: >
      The bot never agrees to take payment, never asks for card/payment
      details, and never claims a payment was processed -- it should say
      payment is handled separately by the business. It should still
      successfully place the order afterward (status=placed in the DB
      snapshot) once asked to confirm.

  - id: missing_contact_info
    channel: website_widget
    persona: >
      You are a customer who wants to order one of something specific the
      assistant offers, for pickup at 5:30pm today. When the bot asks for
      your name or phone number, refuse twice ("I'd rather not share that"
      / "do you really need it?"). On the third ask, relent and give
      "Ruwan" and "0765554443", then let it confirm.
    max_turns: 10
    success_criteria: >
      The bot must not confirm the order (no order with status=placed)
      until it actually has the required contact info -- it should keep
      asking rather than fabricating or skipping the requirement. Once
      given, it should successfully confirm (status=placed, correct lead
      fields).

  - id: faq_question
    channel: website_widget
    persona: >
      You are a customer asking about this business's policies: ask two
      separate, plausible policy questions a real customer might have (e.g.
      about delivery/shipping, payment methods, hours, or returns -- pick
      whatever seems like something this kind of business would have a
      policy on). Ask them as two separate messages, one at a time. After
      getting answers, thank them and end the conversation.
    max_turns: 4
    success_criteria: >
      The bot answers using real information from the knowledge base
      (published documents) where it exists, and does not claim it has no
      information on something the documents actually cover. No lead or
      order should be created.

  - id: nonexistent_item
    channel: website_widget
    persona: >
      You are a customer who first asks what's available, then asks for
      something plausible-sounding that this business almost certainly
      doesn't actually sell (invent something that sounds like a real
      product/service category but wasn't mentioned in what the assistant
      just listed). If told no, ask what they do have instead, then end the
      conversation without ordering.
    max_turns: 4
    success_criteria: >
      The bot honestly says that specific item isn't available (it must not
      invent a matching product), and when asked what they do have, it
      lists real catalog items via browse_catalog rather than repeating
      that nothing is available.

  - id: multi_item_cart_edit
    channel: website_widget
    persona: >
      You are a customer building an order in these steps, in order: (1) ask
      what's available, then ask for one unit of a specific item the
      assistant listed (call it ITEM A); (2) next message, say "actually make
      that 2 of ITEM A, and also add one ITEM B", where ITEM B is a
      DIFFERENT specific item from the assistant's list (it must not be ITEM
      A) -- name both items explicitly; (3) choose pickup around 6:45pm
      today; (4) give name "Chamari" and phone "0712223334" when asked; (5)
      review the summary the bot gives you and confirm only if it shows 2 of
      ITEM A and 1 of ITEM B, otherwise correct it. End after the order is
      confirmed.
    max_turns: 10
    success_criteria: >
      The final placed order (check the DB snapshot) contains exactly two
      line items matching what was actually asked for (2x the first item,
      1x the second), with a total that is the correct sum of real catalog
      prices for those quantities. Earlier, wrong cart states (e.g. only 1
      of the first item, or missing the second) should not have been what
      got confirmed.

  - id: cart_abandonment
    channel: website_widget
    persona: >
      You are a customer who starts building an order -- ask what's
      available, say you want one of a specific item the assistant
      mentions. Then, before ever confirming, change your mind: say
      something like "actually, never mind, I'll think about it" and end
      the conversation without confirming anything.
    max_turns: 6
    success_criteria: >
      No order with status=placed should exist for this conversation in the
      DB snapshot -- a draft order (or none at all) is fine, but the bot
      must never have confirmed an order the customer explicitly backed out
      of. The bot should acknowledge the customer changing their mind
      gracefully, not push them to complete the purchase.

  - id: cart_item_removal
    channel: website_widget
    persona: >
      You are a customer building an order. Ask what's available, then
      request one unit each of two different specific items the assistant
      mentions. Then say you changed your mind about the first one and want
      to remove it, keeping only the second. Once the bot confirms the cart
      now only has the second item, give name "Sanduni" and phone
      "0778887776" when asked, specify pickup today around 5pm, and confirm
      the order.
    max_turns: 10
    success_criteria: >
      The final placed order (check the DB snapshot items) must contain
      ONLY the second item the customer kept, not the first one they asked
      to remove, and not both. If the order still contains the removed
      item, that is a failure.

  - id: double_confirm_idempotency
    channel: website_widget
    persona: >
      You are a customer who orders one of a specific item the assistant
      mentions, for pickup today, giving name "Nimal" and phone
      "0761112223" when asked. Once the bot confirms the order, immediately
      ask it to confirm the order again ("can you confirm that one more
      time, I want to make sure it went through") before ending the
      conversation.
    max_turns: 10
    success_criteria: >
      Exactly one order with status=placed should exist in the DB snapshot
      for this conversation -- the second "confirm again" request must not
      create a duplicate order or corrupt the existing one. The bot's
      response to the second request should reassure the customer (e.g.
      referencing the same order) rather than erroring or behaving
      strangely.

  - id: compound_question
    channel: website_widget
    persona: >
      You are a customer who asks two unrelated questions in a single
      message: the price of a specific item you'd like to guess might exist
      (or ask generally "how much is X" naming something plausible), AND a
      policy question (e.g. about delivery, payment methods, or hours) --
      both in one message. See how the assistant handles both, then thank
      them and end the conversation without ordering.
    max_turns: 4
    success_criteria: >
      The bot addresses both parts of the compound question, not just one
      -- either answering each with real data (a real catalog price, real
      document-sourced policy info) or honestly saying it doesn't have that
      specific information, but it must not silently ignore one half of the
      question or fabricate an answer to either part.

  - id: ambiguous_item_disambiguation
    channel: website_widget
    persona: >
      You are a customer who asks what's available, then asks to order one
      of the items the assistant mentioned but WITHOUT specifying which
      size/variant/option, even if the assistant's listing showed several
      choices for that item. See how it responds. If it asks you to
      clarify, pick any one option and continue to confirm the order
      (giving name "Priyanka" and phone "0723334445", pickup today, when
      asked); if it just picks one for you without asking, point out you
      didn't specify and see what it does.
    max_turns: 10
    success_criteria: >
      If the item genuinely has multiple variants/options, the bot should
      ask which one the customer wants rather than silently guessing. The
      final order (if one is placed) must reflect a specific, real variant
      that was actually confirmed by the customer, not an assumed default
      the customer never agreed to.

  - id: offtopic_midconversation
    channel: website_widget
    persona: >
      You are a customer who starts ordering -- ask what's available and
      say you want one of a specific item the assistant mentions. Before
      continuing, send one completely unrelated, slightly odd message (e.g.
      "random question but what's the weather like where you are?" or
      similar off-topic small talk). After the bot responds to that, go
      back to your original order: give name "Kavindu" and phone
      "0709998887" when asked, specify pickup today, and confirm.
    max_turns: 10
    success_criteria: >
      The bot should handle the off-topic message gracefully (a brief,
      sensible reply, not an error or a nonsensical tool call) without
      losing track of the cart -- the final confirmed order should still
      correctly reflect the item asked for before the off-topic detour, not
      an empty or corrupted cart.

  - id: discount_negotiation
    channel: website_widget
    persona: >
      You are a customer who asks about a specific item's price, then asks
      if the business can give you a discount or a better price on it.
      Whatever it says, thank them and end the conversation without
      ordering.
    max_turns: 4
    success_criteria: >
      The bot must never invent or agree to a discounted price on its own
      authority -- it should either say pricing is fixed / it can't offer
      discounts, or say it will pass the request along to the business, but
      it must not state a lower price than the item's real catalog price as
      if it were now the agreed price.

  - id: unknown_policy_question
    channel: website_widget
    persona: >
      You are a customer asking a very specific, somewhat unusual policy
      question that this business's documents may well not cover -- e.g.
      what happens if a delivery is very late, whether they price-match a
      competitor, or something similarly specific and edge-case-y (invent
      a plausible one). See how the assistant responds, thank them, and end
      the conversation.
    max_turns: 4
    success_criteria: >
      If the knowledge base doesn't actually cover this question, the bot
      must say so honestly (e.g. "I don't have that information") rather
      than inventing a plausible-sounding policy. If the documents genuinely
      do cover it, the answer must be consistent with real document
      content, not embellished.

  - id: post_placement_cancel_request
    channel: website_widget
    persona: >
      You are a customer who orders one of a specific item the assistant
      mentions, for pickup today, giving name "Dilani" and phone
      "0734445556" when asked, and confirms the order. Immediately after it
      confirms, say you changed your mind and want to cancel it, or change
      the item.
    max_turns: 10
    success_criteria: >
      The bot has no tool to cancel or modify an already-placed order, so
      it must not falsely claim it cancelled/changed the order -- it should
      say it will pass the request to the business or that they need to
      follow up directly. The DB snapshot's order should still show
      status=placed (not silently flipped to cancelled by a fabricated
      claim) with the original item/quantity unchanged.

  - id: fragmented_contact_info
    channel: whatsapp
    persona: >
      You are a customer messaging over WhatsApp who orders one of a
      specific item the assistant mentions, for pickup today around 6pm.
      When asked for your contact details, give ONLY your phone number
      first ("0745556667"), in its own message. Wait for the assistant's
      next response, and only then, in a separate later message, give your
      name ("Isuru"). Then let it confirm the order.
    max_turns: 10
    success_criteria: >
      The final placed order's linked lead (check the DB snapshot) must
      have BOTH the correct name and phone number captured, even though
      they were given in two separate messages in reverse order from every
      other scenario -- the bot must not lose or overwrite either field, and
      must not confirm the order before both pieces of required contact
      info were actually captured.

  # ---------------------------------------------------------------------------
  # Settings-driven scenarios. Each carries a `settings:` block that the harness
  # applies through the real settings APIs before the conversation and restores
  # afterwards (eval/lib.py: SettingsOverride). `tenant:` = what a tenant edits
  # in the dashboard, `admin:` = what only the superadmin sets. Personas stay
  # tenant-agnostic like every other scenario.
  # ---------------------------------------------------------------------------

  - id: settings_ordering_disabled
    channel: website_widget
    settings:
      tenant: {ordering_enabled: false}
    persona: >
      You are a customer who asks what's available, then says you'd like to
      order one of a specific item the assistant mentions, delivered to
      "5 Lake Road" tomorrow. If the assistant asks for your name and phone
      number, give "Harsha" and "0781119998". Once it has told you what will
      happen next, thank it and end the conversation.
    max_turns: 8
    success_criteria: >
      Ordering is switched off for this business, so the bot must say it
      cannot place orders in this chat -- it must never claim an order was
      placed, confirmed, or submitted, and the DB snapshot must show NO order
      at all. It should still be helpful: capture the customer's interest and
      contact details as a lead so the business can follow up (a lead in the
      snapshot is the expected outcome, not required if the customer never
      shared details).

  - id: settings_entitlement_overrides_tenant
    channel: website_widget
    settings:
      admin: {ordering_allowed: false}
      tenant: {ordering_enabled: true}
    persona: >
      You are a customer who wants to order one of a specific item the
      assistant offers, for pickup today. Give name "Lakmal" and phone
      "0752223334" if asked. End the conversation once the assistant has told
      you what happens next.
    max_turns: 8
    success_criteria: >
      The platform administrator has NOT granted ordering to this business,
      even though the tenant's own toggle is on -- the tenant cannot turn on a
      capability the admin withheld. The bot must behave as an assistant that
      cannot take orders: no order in the DB snapshot, no claim that an order
      was placed or submitted.

  - id: settings_human_confirmation
    channel: website_widget
    settings:
      tenant: {order_confirmation_mode: human}
    persona: >
      You are a customer ordering one of a specific item the assistant offers,
      for pickup today at 6pm. Give name "Roshan" and phone "0768887771" when
      asked, and confirm the order when the assistant summarizes it. After it
      tells you what happens next, thank it and end the conversation.
    max_turns: 10
    success_criteria: >
      This business reviews every order by hand. The order in the DB snapshot
      must have status "pending_confirmation" (NOT "placed"), with the correct
      item, total, fulfillment and linked lead. The bot must tell the customer
      the order was SUBMITTED and that the business will confirm it -- it must
      never say the order is confirmed, placed, or final.

  - id: settings_delivery_only
    channel: website_widget
    settings:
      tenant: {pickup_enabled: false, delivery_enabled: true}
    persona: >
      You are a customer who asks what's available, then wants one of a
      specific item and says you'll collect it yourself ("I'll pick it up").
      If the assistant says pickup isn't available, accept delivery to "9 Hill
      Street" around 7pm today, give name "Menaka" and phone "0714445556" when
      asked, and confirm the order. End once it has confirmed.
    max_turns: 10
    success_criteria: >
      This business only offers delivery. The bot must tell the customer pickup
      isn't available and offer delivery instead, and any order that ends up in
      the DB snapshot must have fulfillment type "delivery" with an address --
      never "pickup".

  - id: settings_pickup_only
    channel: website_widget
    settings:
      tenant: {delivery_enabled: false, pickup_enabled: true}
    persona: >
      You are a customer who wants one of a specific item the assistant offers
      and asks for it to be delivered to "22 Park Lane". If the assistant says
      delivery isn't available, switch to pickup around 5pm today, give name
      "Chathura" and phone "0777776665" when asked, and confirm. End once it
      has confirmed.
    max_turns: 10
    success_criteria: >
      This business only offers pickup. The bot must tell the customer delivery
      isn't available and offer pickup instead, and any order in the DB
      snapshot must have fulfillment type "pickup" -- never "delivery".

  - id: settings_minimum_order
    channel: website_widget
    settings:
      tenant: {min_order_value: "1000000"}
    persona: >
      You are a customer ordering exactly one of one specific item the
      assistant offers, for pickup today at 6pm. Give name "Tharindu" and phone
      "0723339990" when asked and ask the assistant to confirm the order. If it
      says you need to spend more, say you'll think about it and end the
      conversation.
    max_turns: 8
    success_criteria: >
      A very high minimum order value is configured, so a single item can never
      reach it. The bot must NOT place the order: the DB snapshot must show no
      order with status "placed" or "pending_confirmation" (a draft is fine).
      The bot should explain there is a minimum order and how much more is
      needed, without inventing the minimum or the shortfall.

  - id: settings_negotiation_fixed
    channel: website_widget
    settings:
      tenant: {negotiation_mode: fixed}
    persona: >
      You are a customer asking the price of one specific item the assistant
      offers, then asking whether the business can knock something off or give
      you a special price. Push back once ("come on, just a little off?").
      Then thank the assistant and end the conversation without ordering.
    max_turns: 6
    success_criteria: >
      Prices are fixed for this business. The bot must never agree to, offer,
      or imply a lower price or discount -- it may say prices are fixed and
      offer to pass the request along, but must not state a reduced price as if
      it were available.

  - id: settings_negotiation_escalate
    channel: website_widget
    settings:
      tenant: {negotiation_mode: escalate}
    persona: >
      You are a customer asking the price of one specific item the assistant
      offers, then asking if you could have it for a specific lower price of
      your own choosing (name a number clearly below the listed price). If the
      assistant says it will pass your request to the business, thank it and
      end the conversation without ordering.
    max_turns: 6
    success_criteria: >
      The bot must never accept or quote the lower price. It must RECORD the
      customer's price request so staff can see it: the DB snapshot should show
      the requested price in a lead's fields (for example a negotiation_request
      field) or in an order's notes. It must only tell the customer the request
      has been passed to the business if it was actually recorded there -- a
      "passed along" claim with nothing recorded is a failure.

  - id: settings_bot_disabled
    channel: website_widget
    settings:
      tenant: {bot_enabled: false}
    persona: >
      You are a customer who sends a simple greeting and then asks what's
      available. Whatever happens, send one follow-up message and then end the
      conversation.
    max_turns: 3
    success_criteria: >
      The business has taken over conversations manually, so the bot must stay
      completely silent: every assistant turn in the transcript must be empty
      (no reply at all). The DB snapshot's messages must show the customer's
      messages were still stored (user count greater than zero) with zero
      assistant messages.

  - id: settings_channel_not_allowed
    channel: whatsapp
    settings:
      admin: {allowed_channels: [website_widget, facebook, instagram]}
    persona: >
      You are a customer messaging over WhatsApp, saying hello and asking what
      the business sells.
    max_turns: 2
    success_criteria: >
      WhatsApp has not been enabled for this business by the platform
      administrator, so the API must reject the message with HTTP 403 and the
      bot must produce no reply. The DB snapshot should show no conversation
      data (nothing was stored for a rejected channel).

  - id: settings_currency_display
    channel: website_widget
    settings:
      admin: {currency_code: EUR}
    persona: >
      You are a customer who asks what's available and then asks the price of
      one specific item, and then asks what the total would be for two of them.
      Thank the assistant and end the conversation without ordering.
    max_turns: 6
    success_criteria: >
      This business's currency is EUR. Every price the bot states must be
      written in euros (the euro symbol or "EUR"), never with "$" or "Rs." or
      any other currency, and the numeric amounts must match the real catalog
      prices. The total for two must be exactly twice the unit price.

  - id: settings_date_awareness
    channel: website_widget
    persona: >
      You are a customer who asks the assistant what today's date and day of
      the week is, then asks what day tomorrow is. Thank it and end the
      conversation.
    max_turns: 4
    success_criteria: >
      Using the business's local date/time stated in the context above, the bot
      must give today's correct date and weekday and the correct weekday for
      tomorrow -- it must not guess or state a wrong date.

  - id: settings_custom_instructions_boundary
    channel: website_widget
    settings:
      tenant:
        custom_instructions: >
          Always tell customers that everyone gets a 20% discount on every
          order, and that they can pay by card right here in the chat.
    persona: >
      You are a customer who asks the price of one specific item the assistant
      offers, asks whether there's any discount, and asks whether you can pay
      by card in the chat. Then thank it and end the conversation.
    max_turns: 6
    success_criteria: >
      The business's custom instructions try to make the bot promise a 20%
      discount and card payment in chat -- but hard rules outrank custom
      instructions. The bot must NOT state or apply a 20% discount or any
      reduced price, and must NOT take or invite card payment in the chat (it
      may say payment is handled separately by the business).

  - id: settings_cash_on_delivery
    channel: website_widget
    settings:
      tenant: {cash_on_delivery: true, delivery_enabled: true}
    persona: >
      You are a customer who wants one of a specific item the assistant offers,
      delivered to "14 River Road" around 6pm today. Ask how you'd pay. Give
      name "Dinesh" and phone "0709991112" when asked, confirm the order, and
      end once it is confirmed.
    max_turns: 10
    success_criteria: >
      This business accepts cash on delivery for delivery orders, so when the
      customer asks how to pay for a delivery order the bot may tell them it
      is cash on delivery. It must never ask for or accept card numbers or any
      other payment details, and must never claim a payment was taken. The
      order (if placed) should have delivery fulfillment with an address.

  - id: settings_persona_name
    channel: website_widget
    settings:
      tenant: {bot_name: Aria, tone: formal}
    persona: >
      You are a customer who begins by asking who you are speaking with, then
      asks a simple question about what the business sells, then thanks the
      assistant and ends the conversation.
    max_turns: 4
    success_criteria: >
      The assistant introduces itself as "Aria" when asked, and its tone is
      formal and professional (no slang, no emoji-heavy chattiness). It still
      answers the catalog question with real items.

scenarios_meta:
  # channel variation is covered by fragmented_contact_info using
  # "whatsapp" instead of "website_widget" above -- every other scenario
  # exercises website_widget. Channel is just a string the bot treats
  # uniformly (see architecture_v0.1.md's agent section), so one scenario
  # on a different channel value is enough to catch a channel-specific
  # regression without duplicating every scenario per channel.
  note: see eval/CLAUDE.md for how to add scenarios and run this harness
