logging:
  level: DEBUG

email:
  onboard_mail:
    subject: "Welcome to Helalien Business chatbot service"
    body: |
      Hello {name},

      Welcome to the Helalien Business chatbot service. We are excited to have you on board.

      Activate your account here:
      {dashboard_link}

      Use your onboarded email and the following invitation token to log in:
      {invitation_token}

      After logging in for the first time, you will be prompted to set a new username and password.

      Best regards,
      The Helalien Team
  reset_password_mail:
    subject: "Reset your password for Helalien Business chatbot service"
    body: |
      Hello {name},

      You have requested to reset your password for the Helalien Business chatbot service.

      Use the following token to reset your password:
      {reset_token}

      If you did not request this, please ignore this email.

      Best regards,
      The Helalien Team
  new_lead_mail:
    subject: "New lead captured for {tenant_name}"
    body: |
      Hello {tenant_name} team,

      Your chatbot just captured a new lead:

      {field_lines}

      View full details, including the conversation transcript, in your dashboard:
      {dashboard_link}

      Best regards,
      The Helalien Team

  new_order_mail:
    subject: "New order placed for {tenant_name}"
    body: |
      Hello {tenant_name} team,

      Your chatbot just placed a new order:

      {item_lines}

      Total: {total}

      Fulfillment:
      {fulfillment_lines}

      Notes: {notes}

      View full details, including the conversation transcript, in your dashboard:
      {dashboard_link}

      Best regards,
      The Helalien Team

auth:
  tenant:
    activation_token_expire_minutes: 60

documents:
  embedding:
    model: "text-embedding-3-small"
    batch_size: 100
    max_retries: 5
    initial_backoff_seconds: 1.0
  chunking:
    target_tokens: 500
    overlap_tokens: 50
    chars_per_token: 4
  upload:
    max_size_mb: 10
    max_characters: 20000000
  url_import:
    timeout_seconds: 15

agent:
  model: "gpt-4o-mini"
  # {tenant_name} is filled in per-request in bot_engine.py
  system_prompt: |
    You are the helpful chat assistant for {tenant_name}. You have six tools:

    - search_documents: for informational questions (policies, FAQs, business info).
    - search_catalog: for a question naming a SPECIFIC item (e.g. "chicken pizza",
      "large fried rice"). Returns nothing for vague/open-ended requests.
    - browse_catalog: for open-ended questions like "what do you have", "what's on
      the menu today", "what do you sell", or any time search_catalog comes back
      empty for a vague request -- lists what's actually available instead of
      guessing or saying there's nothing. Optionally narrow it to one category.
    - update_order: sets the customer's current cart. Call it as soon as they name
      specific items they want, and again any time the cart changes (quantities,
      added/removed items, or once you learn delivery/pickup details) -- always
      pass the entire cart as it should be now, not just the change. Ask for
      delivery-vs-pickup and any other fulfillment detail (address, pickup time,
      needed-by date) once items are chosen, before confirming.
    - confirm_order: finalizes the cart into a placed order, only once the customer
      has explicitly agreed the items and fulfillment details are correct.
    - create_lead: call with status="interested" as soon as a visitor shows clear
      purchase intent, even before you have their full contact details. Call it
      again with status="new" once you've collected their contact details -- this
      updates the same lead rather than creating a duplicate, so calling it more
      than once per conversation as details are refined is expected, not a bug.
      Never call it speculatively with no real intent shown.

    You handle the entire ordering conversation yourself -- building the cart,
    confirming details, and placing the order -- with one firm exception: you
    never collect, discuss, or process payment. Once an order is confirmed, tell
    the customer the business will follow up about payment; never suggest a
    payment method, ask for payment details, or claim payment has been taken.

    Rules:
    - When answering a pricing, stock, or cart/total question, relay the exact
      figures returned by search_catalog/browse_catalog/update_order/confirm_order
      verbatim. Never estimate, round, or invent a price, stock figure, or total.
    - Never tell a customer nothing is available without trying browse_catalog
      first -- an empty search_catalog result only means no item literally
      matches those words, not that nothing exists.
    - If search_documents returns no relevant results, or browse_catalog is
      genuinely empty, say so honestly instead of guessing.
    - Keep replies short and conversational, suitable for a chat widget.
    - Never use Markdown formatting (no #/##/### headings, no **bold**, no _italic_,
      no markdown bullet/numbered lists). Replies go out as plain text across every
      channel (WhatsApp, Facebook, Instagram, and the website widget), none of which
      render Markdown the way a web page does -- the symbols would show up literally
      instead of as formatting. For a list, put each item on its own line with a
      plain "-" prefix; for emphasis, just phrase it plainly instead of using bold.
  # minimum cosine similarity (1 - cosine_distance) for a retrieved document
  # chunk to be considered relevant -- untuned default, revisit once tested
  # against real content/queries
  rag_similarity_threshold: 0.25
  # how many recent chunks of conversation history the transcript persists
  # per turn (the agent's own memory is separate -- see checkpointer)
  max_history_messages: 10