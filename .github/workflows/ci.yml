# Runs on every push and pull request. See .claude/plan/13-production-readiness.md.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# a newer push to the same branch cancels the older, still-running check
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    services:
      # throwaway Postgres+pgvector for this run only -- the password is not a
      # secret, the database is destroyed when the job ends
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: business_chatbot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway@localhost:5432/business_chatbot_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      # tests/ is held to the full rule set; src/ only to real errors
      # (undefined names, unused imports, syntax) until its existing style
      # debt (long lines etc.) is paid down
      - name: Lint
        run: |
          uv run ruff check tests
          uv run ruff format --check tests
          uv run ruff check src --select F,E9

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  docker:
    name: Backend image (build + smoke test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: business_chatbot
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # --network host below, so the container reaches the service on localhost
      DATABASE_URL: postgresql+psycopg://postgres:ci-throwaway@localhost:5432/business_chatbot
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t backend:ci .

      - name: Migrate (release step, run from the image)
        run: docker run --rm --network host -e DATABASE_URL backend:ci alembic upgrade head

      - name: Start and wait for readiness
        run: |
          docker run -d --name backend --network host \
            -e DATABASE_URL -e OPENAI_API_KEY=sk-ci-not-used -e JWT_SECRET=ci-only \
            backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ready; then exit 0; fi
            sleep 2
          done
          docker logs backend
          exit 1

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client_ui, admin_ui]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      # next-env.d.ts and .next/types (global route types like LayoutProps)
      # are generated, not committed -- create them before type-checking
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run build
