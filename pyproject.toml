[project]
name = "qna-chatbot"
version = "0.1.0"
description = "AI chatbot platform for businesses — RAG-powered chat widget, lead capture, and admin dashboard API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.54",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib's bcrypt backend detection is broken against bcrypt>=4.1 (removed
    # `__about__`), causing a bogus internal self-test ValueError -- pin below it.
    "bcrypt<4.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "reportlab>=4.2",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
