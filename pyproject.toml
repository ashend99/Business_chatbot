[project]
name = "qna-chatbot"
version = "0.1.0"
description = "AI chatbot platform for businesses — RAG-powered chat widget, lead capture, and admin dashboard API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.54",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    # passlib's bcrypt backend detection is broken against bcrypt>=4.1 (removed
    # `__about__`), causing a bogus internal self-test ValueError -- pin below it.
    "bcrypt<4.1",
    "email-validator>=2.2",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "langgraph>=1.2.11",
    "langchain-core>=1.6.1",
    "langchain-openai>=1.6.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "rank-bm25>=0.2.2",
    # already pulled in transitively by langchain-core; declared explicitly
    # since api/bot/router.py now imports it directly for eval distributed
    # tracing (see eval/LANGSMITH_PLAN.md)
    "langsmith>=0.12.1",
    # error reporting, active only when SENTRY_DSN is set (see app/main.py)
    "sentry-sdk[fastapi]>=2.0",
    # IANA timezone data for zoneinfo -- Windows and slim Linux images don't
    # ship it, and every bot turn renders the tenant's local time
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "reportlab>=4.2",
]

[tool.ruff]
line-length = 100
src = ["src", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
# one event loop for the whole run: the app's SQLAlchemy engine is a
# module-level singleton, and its pooled connections are bound to the loop
# that opened them -- a fresh loop per test would strand them
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs the Postgres test database (TEST_DATABASE_URL) -- skipped when it isn't configured",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/utils", "experiments/ragkit"]
